name: Bug report
description: Report a reproducible problem in Hansen.
title: ""
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach APK files, API keys, personal data, or confidential reports.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the actions that reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version and operating system
      placeholder: "1.0.0, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error message
      description: Remove file paths, credentials, and private package details.
    validations:
      required: false
